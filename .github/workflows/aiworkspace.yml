name: aiworkspace

on:
  push:
    branches: [main]
    paths: ["aiworkspace/**", ".github/workflows/aiworkspace.yml"]
  pull_request:
    paths: ["aiworkspace/**", ".github/workflows/aiworkspace.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No network, no API key: provider tests use canned responses.
      - name: Run the test suite
        run: python -m unittest discover -s aiworkspace/tests -t . -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linters
        run: |
          python -m pip install ruff mypy
          npm install --global typescript eslint
      - name: Python lint and types
        run: |
          ruff check aiworkspace
          ruff format --check aiworkspace
          mypy --strict aiworkspace --exclude aiworkspace/tests
      - name: UI types and lint
        working-directory: aiworkspace
        run: |
          tsc -p jsconfig.json
          eslint static
