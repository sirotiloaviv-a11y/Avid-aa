name: trading_bot

on:
  push:
    branches: [main]
    paths: ["trading_bot/**", ".github/workflows/trading_bot.yml"]
  pull_request:
    paths: ["trading_bot/**", ".github/workflows/trading_bot.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s trading_bot/tests -t . -v
