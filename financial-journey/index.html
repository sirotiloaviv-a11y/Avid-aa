  ctx.fillStyle = 'rgba(8,12,28,.42)'; ctx.fill();
  ctx.strokeStyle = 'rgba(238,243,251,.18)'; ctx.lineWidth = 1; ctx.stroke();
  // grid
  ctx.lineWidth = 1;
  for (const v of [-25, 0, 50, 100, 150]) {
    const a = project([-9.4, GY(v), GZ]), b = project([9.4, GY(v), GZ]);
    ctx.strokeStyle = v === 0 ? 'rgba(238,243,251,.55)' : 'rgba(238,243,251,.12)';
    ctx.setLineDash(v === 0 ? [] : [4, 6]);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    label(fmtK(v), [-9.55, GY(v), GZ], 0.2, 'rgba(238,243,251,.6)', 'right');
  }
  ctx.setLineDash([]);
  for (let a = 18; a <= 30; a++) {
    const p = project([GX(a), GY0 - 0.15, GZ]), q = project([GX(a), GY0 - 0.02, GZ]);
    ctx.strokeStyle = 'rgba(238,243,251,.35)'; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
    label(String(a), [GX(a), GY0 - 0.33, GZ], 0.22, a <= age + 0.01 ? 'rgba(238,243,251,.9)' : 'rgba(238,243,251,.35)', 'center', 800);
  }
  // area under net worth
  const zero = project([0, GY(0), GZ]);
  ctx.save();
  tracePath(nwPts, n);
  const last = project(nwPts[n]), first = project(nwPts[0]);
  const z0 = project([nwPts[n][0], GY(0), GZ]), z1 = project([nwPts[0][0], GY(0), GZ]);
  ctx.lineTo(z0[0], z0[1]); ctx.lineTo(z1[0], z1[1]); ctx.closePath();
  ctx.save(); regionClip(0, VMAX); ctx.fillStyle = 'rgba(62,226,138,.16)'; ctx.fill(); ctx.restore();
  ctx.save(); regionClip(VMIN, 0); ctx.fillStyle = 'rgba(255,93,115,.2)'; ctx.fill(); ctx.restore();
  ctx.restore();
  // bank line
  ctx.lineJoin = ctx.lineCap = 'round';
  tracePath(bkPts, n);
  ctx.strokeStyle = '#52c7f2'; ctx.lineWidth = 0.05 * F / last[2];
  ctx.shadowColor = '#52c7f2'; ctx.shadowBlur = 10 * DPR; ctx.stroke();
  // net worth line, green above zero and red below
  for (const [v0, v1, col] of [[0, VMAX + 50, '#3ee28a'], [VMIN - 50, 0, '#ff5d73']]) {
    ctx.save(); regionClip(v0, v1);
    tracePath(nwPts, n);
    ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 16 * DPR; ctx.lineWidth = 0.1 * F / last[2]; ctx.stroke();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
  // markers
  const nw = netWorth(age), bk = bankBal(age);
  const mp = project([GX(age), GY(nw), GZ]), bp = project([GX(age), GY(bk), GZ]);
  const drop = project([GX(age), GY0 - 0.02, GZ]);
  ctx.strokeStyle = 'rgba(255,201,74,.5)'; ctx.setLineDash([3, 4]); ctx.lineWidth = 1.2 * DPR;
  ctx.beginPath(); ctx.moveTo(mp[0], mp[1]); ctx.lineTo(drop[0], drop[1]); ctx.stroke(); ctx.setLineDash([]);
  const col = nw >= 0 ? '#3ee28a' : '#ff5d73';
  const r = 0.16 * F / mp[2];
  const glow = ctx.createRadialGradient(mp[0], mp[1], 0, mp[0], mp[1], r * 4);
  glow.addColorStop(0, nw >= 0 ? 'rgba(62,226,138,.55)' : 'rgba(255,93,115,.55)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(mp[0], mp[1], r * 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mp[0], mp[1], r, 0, 7); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(mp[0], mp[1], r * 0.62, 0, 7); ctx.fill();
  ctx.fillStyle = '#52c7f2'; ctx.beginPath(); ctx.arc(bp[0], bp[1], r * 0.55, 0, 7); ctx.fill();
  label(fmtK(nw), [GX(age) + 0.1, GY(nw) + 0.42, GZ], 0.34, col, 'left', 800);
}

/* ---------------- HUD ---------------- */
const $ = id => document.getElementById(id);
const track = $('track');
CHAPTERS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'seg'; b.style.flex = String(c.t1 - c.t0);
  b.innerHTML = `<span>${c.name}</span><span class="yrs num">${c.yrs}</span><i class="fill"></i>`;
  b.addEventListener('click', () => { seek(c.t0 + (i ? 0.01 : 0)); });
  track.appendChild(b); c.el = b;
});
let subIdx = -1;
function hud(t, age) {
  const ci = chapterAt(t);
  $('chapName').textContent = CHAPTERS[ci].name;
  $('age').textContent = Math.floor(age + 1e-6);
  const nw = netWorth(age), bk = bankBal(age);
  $('nw').textContent = fmtFull(nw); $('nw').classList.toggle('neg', nw < 0);
  $('bank').textContent = fmtFull(bk);
  CHAPTERS.forEach((c, i) => {
    c.el.classList.toggle('on', i === ci);
    const f = Math.min(1, Math.max(0, (t - c.t0) / (c.t1 - c.t0)));
    c.el.querySelector('.fill').style.transform = `scaleX(${f})`;
  });
  let e = 0; while (e + 1 < EVENTS.length && age >= EVENTS[e + 1][0]) e++;
  if (e !== subIdx) {
    subIdx = e; const s = $('sub'); s.textContent = EVENTS[e][1];
    s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash');
  }
  $('titleCard').style.opacity = t < 2.2 ? 1 : Math.max(0, 1 - (t - 2.2) / 0.8);
  $('endCard').style.opacity = Math.min(1, Math.max(0, (t - 33.8) / 1));
  document.querySelector('.hud.top').style.opacity = 1 - +$('titleCard').style.opacity;
}

/* ---------------- frame ---------------- */
const lerp = (a, b, k) => a + (b - a) * k;
const mix3 = (a, b, k) => [0, 1, 2].map(i => lerp(a[i], b[i], k));
let camX = GX(18);
let prevNW = netWorth(18);

function frame(t, dt) {
  const age = ageAt(t), ci = chapterAt(t), ch = CHAPTERS[ci];
  // chapter blend for sky: fade over 1.2s around each boundary
  let sky = ch.sky, sun = ch.sun;
  if (ci > 0 && t - ch.t0 < 1.2) {
    const k = (t - ch.t0) / 1.2, p = CHAPTERS[ci - 1];
    sky = [mix3(p.sky[0], ch.sky[0], k), mix3(p.sky[1], ch.sky[1], k)]; sun = mix3(p.sun, ch.sun, k);
  }
  tint = sun;

  // character: walk along the age axis, spin into the next outfit at chapter changes
  const x = GX(age), speed = Math.abs(ageAt(t + 0.05) - age) / 0.05 * 1.5;
  char.pos[0] = x;
  const walking = speed > 0.05;
  const phase = t * (4 + speed * 5);
  const swing = walking ? Math.min(0.7, 0.25 + speed * 0.5) : 0;
  legs[0].rot[0] = Math.sin(phase) * swing; legs[1].rot[0] = -Math.sin(phase) * swing;
  arms[0].rot[0] = -Math.sin(phase) * swing * 0.8;
  const holding = outfitNow === 'uni' || outfitNow === 'tech';
  arms[1].rot[0] = holding ? -0.9 : Math.sin(phase) * swing * 0.8;
  arms[0].rot[2] = -0.08; arms[1].rot[2] = 0.08;
  char.pos[1] = walking ? Math.abs(Math.sin(phase)) * 0.05 : Math.sin(t * 2) * 0.01;
  let spin = 0;
  const nextBoundary = CHAPTERS.find(c => c.t0 > 0 && Math.abs(t - c.t0) < 0.5);
  if (nextBoundary) {
    const k = (t - nextBoundary.t0 + 0.5); // 0..1
    spin = (1 - Math.cos(k * Math.PI)) * Math.PI;
    if (k > 0.45 && k < 0.45 + dt + 1e-3) burst(x);
  }
  wear(ch.id);
  char.rot[1] = (walking ? 0.75 : 0.2) + spin;

  // plane loops above the mountains
  const pa = t * 0.5;
  plane.pos = [-3.5 + Math.cos(pa) * 4.5, 6.4 + Math.sin(pa * 2) * 0.3, -8 + Math.sin(pa) * 1.5];
  plane.rot = [0, -pa - Math.PI / 2 + Math.PI, Math.sin(pa) * 0.2];
  flag.children[1].rot[1] = 0.25 + Math.sin(t * 2.2) * 0.12;

  // money flow: coins up to the graph while net worth rises, red coins fall while it drops
  const nw = netWorth(age), d = dt > 0 ? (nw - prevNW) / dt : 0; prevNW = nw;
  const rate = Math.min(22, Math.abs(d) * 0.9);
  if (dt > 0 && rnd() < rate * dt) {
    if (d > 0) coins.push({ kind: 'up', p0: [x + (rnd() - 0.5) * 0.4, 2.1, CHAR_Z], p1: [GX(age), GY(nw), GZ], life: 0, dur: 1.1 + rnd() * 0.3 });
    else coins.push({ kind: 'down', pos: [GX(age) + (rnd() - 0.5) * 0.3, GY(nw), GZ + 0.3], vel: [(rnd() - 0.5) * 1.5, 1 + rnd(), 1.2 + rnd() * 1.4], life: 0, dur: 1.6 });
  }
  for (const c of coins) {
    c.life += dt;
    if (c.kind === 'up') {
      const k = Math.min(1, c.life / c.dur), e = 1 - Math.pow(1 - k, 2);
      c.pos = [lerp(c.p0[0], c.p1[0], e), lerp(c.p0[1], c.p1[1], e) + Math.sin(k * Math.PI) * 1.4, lerp(c.p0[2], c.p1[2], e)];
    } else {
      c.vel[1] -= 7 * dt; c.pos = c.pos.map((v, i) => v + c.vel[i] * dt);
      if (c.pos[1] < 0.06) { c.pos[1] = 0.06; c.vel[1] *= -0.3; c.vel[0] *= 0.6; c.vel[2] *= 0.6; }
    }
  }
  for (let i = coins.length - 1; i >= 0; i--) if (coins[i].life > coins[i].dur) coins.splice(i, 1);
  for (const b of bursts) { b.life += dt; b.vel[1] -= 3 * dt; b.pos = b.pos.map((v, i) => v + b.vel[i] * dt); }
  for (let i = bursts.length - 1; i >= 0; i--) if (bursts[i].life > 1.2) bursts.splice(i, 1);

  // camera follows the character; on narrow screens it follows more tightly
  const aspect = W / H;
  const follow = 1 - 0.55 * Math.min(1, Math.max(0, (aspect - 0.7) / 1));
  const dist = aspect < 1 ? 12.5 : 10.5;
  camX = lerp(camX, x * follow, Math.min(1, dt * 2.5 || 1));
  const sway = REDUCED ? 0 : Math.sin(t * 0.35) * 1.2;
  cam.eye = [camX + sway, 3.1 + (REDUCED ? 0 : Math.sin(t * 0.5) * 0.2), dist];
  cam.tgt = [camX * 0.96, aspect < 1 ? 3.6 : 3.3, -2];
  camUpdate();

  // ---- draw
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sg = ctx.createLinearGradient(0, 0, 0, H);
  sg.addColorStop(0, `rgb(${sky[0].map(v => v | 0)})`); sg.addColorStop(1, `rgb(${sky[1].map(v => v | 0)})`);
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  // sun
  const sp = project([camX - 4, 8.5, -30]);
  const sgl = ctx.createRadialGradient(sp[0], sp[1], 0, sp[0], sp[1], H * 0.35);
  sgl.addColorStop(0, `rgba(${sun.map(v => v | 0)},.55)`); sgl.addColorStop(1, `rgba(${sun.map(v => v | 0)},0)`);
  ctx.fillStyle = sgl; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(${sun.map(v => v | 0)},.9)`; ctx.beginPath(); ctx.arc(sp[0], sp[1], H * 0.045, 0, 7); ctx.fill();
  // drifting dust
  for (const p of dust) {
    const q = project([p[0], (p[1] + t * 0.15 * (0.5 + p[3])) % 9, p[2]]);
    if (q[2] < 0.5) continue;
    ctx.fillStyle = `rgba(255,255,255,${0.12 + p[3] * 0.25})`;
    ctx.fillRect(q[0], q[1], 2 * DPR * (0.5 + p[3]), 2 * DPR * (0.5 + p[3]));
  }

  polys.ground.length = polys.far.length = polys.near.length = 0;
  collect(scene, I_AFF);
  const byDepth = (a, b) => b.z - a.z;
  polys.ground.sort(byDepth).forEach(drawPoly);
  // soft shadow under the character
  const sh = [];
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; sh.push(project([x + Math.cos(a) * 0.42, 0.02, CHAR_Z + Math.sin(a) * 0.26])); }
  ctx.beginPath(); sh.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill();
  polys.far.sort(byDepth).forEach(drawPoly);
  ctx.save(); drawGraph(age); ctx.restore();
  // near geometry + coins + bursts, all depth-sorted together
  const items = polys.near.map(p => ({ z: p.z, draw: () => drawPoly(p) }));
  for (const c of coins) {
    const q = project(c.pos); if (q[2] < 0.3) continue;
    const r = 0.13 * F / q[2], fade = c.kind === 'down' ? Math.max(0, 1 - c.life / c.dur) : 1;
    items.push({ z: q[2], draw: () => {
      ctx.globalAlpha = fade;
      const sq = Math.abs(Math.cos(c.life * 9));
      ctx.fillStyle = c.kind === 'up' ? '#ffc94a' : '#ff5d73';
      ctx.beginPath(); ctx.ellipse(q[0], q[1], r * (0.25 + 0.75 * sq), r, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = c.kind === 'up' ? '#b8841c' : '#a8283a'; ctx.lineWidth = r * 0.18; ctx.stroke();
      if (sq > 0.5) { ctx.fillStyle = c.kind === 'up' ? '#8a5f0c' : '#fff'; ctx.font = `800 ${r * 1.2}px sans-serif`; ctx.direction = 'ltr'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('₪', q[0], q[1] + r * 0.05); }
      ctx.globalAlpha = 1;
    } });
  }
  for (const b of bursts) {
    const q = project(b.pos); if (q[2] < 0.3) continue;
    const s = 0.07 * F / q[2] * (1 - b.life / 1.2);
    items.push({ z: q[2], draw: () => { ctx.fillStyle = b.col; ctx.fillRect(q[0] - s / 2, q[1] - s / 2, s, s); } });
  }
  items.sort(byDepth).forEach(i => i.draw());
  // world-anchored labels
  if (ci === 1 || (ci === 0 && t > 7) || (ci === 2 && t < 18)) signLabels.forEach(([s, p]) => label(s, p, 0.13, '#3a2412', 'center', 800));

  hud(t, age);
}
function burst(x) {
  const cols = ['#ffc94a', '#3ee28a', '#52c7f2', '#ff8fa3', '#ffffff'];
  for (let i = 0; i < 40; i++) {
    const a = rnd() * Math.PI * 2, s = 1 + rnd() * 2.5;
    bursts.push({ pos: [x, 1.2 + rnd() * 0.6, CHAR_Z], vel: [Math.cos(a) * s, 1 + rnd() * 3, Math.sin(a) * s * 0.5], col: cols[i % cols.length], life: rnd() * 0.3 });
  }
}

/* ---------------- loop ---------------- */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = canvas.clientWidth * DPR; H = canvas.clientHeight * DPR;
  canvas.width = W; canvas.height = H;
  F = (H / 2) / Math.tan(FOV / 2);
}
addEventListener('resize', resize); resize();

let t = 0, playing = true, last = performance.now();
function seek(nt) { t = nt; coins.length = 0; bursts.length = 0; prevNW = netWorth(ageAt(t)); camX = GX(ageAt(t)) * 0.5; subIdx = -1; }
function setPlaying(p) {
  playing = p; $('icoPause').hidden = !p; $('icoPlay').hidden = p;
  $('play').setAttribute('aria-label', p ? 'השהה' : 'נגן');
}
$('play').addEventListener('click', () => setPlaying(!playing));
$('restart').addEventListener('click', () => { seek(0); setPlaying(true); });
addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });

function tick(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!playing) dt = 0;
  t += dt;
  if (t > T_END) { if (REC) { window.__done = true; t = T_END; } else seek(0); }
  frame(t, dt);
  requestAnimationFrame(tick);
}
seek(0);
requestAnimationFrame(tick);
window.__seek = seek;
})();
</script>
